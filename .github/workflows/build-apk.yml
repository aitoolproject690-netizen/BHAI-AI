name: Build BHAI X APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      official_release:
        description: 'Owner-approved official release'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run smoke tests
        run: npm install && npm run build
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BHAI-X-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Owner official release gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.official_release == true }}
        env:
          BHAI_OWNER_RELEASE: ${{ secrets.BHAI_OWNER_RELEASE }}
        run: |
          test "$BHAI_OWNER_RELEASE" = "AUTHORIZED" || { echo "Owner release authorization missing"; exit 1; }
          echo "BHAI X official release gate passed"
