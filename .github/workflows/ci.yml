name: BHAI-X CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Validate self-hosted Compose file
        run: |
          BHAI_X_DB_PASSWORD=ci-secret BHAI_CORE_URL=http://core.local BHAI_CORE_API_KEY=ci-key docker compose -f docker-compose.selfhost.yml config -q
      - name: Build self-hosted Docker image
        run: docker build --tag bhai-x-ci .
      - name: Smoke-test self-hosted container
        run: |
          set -e
          docker run --detach --name bhai-x-ci-run -p 10000:10000 bhai-x-ci
          trap 'docker rm -f bhai-x-ci-run >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:10000/api/health >/tmp/bhai-x-health.json; then
              node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/bhai-x-health.json","utf8")); if(d.ok!==true) process.exit(1); console.log(JSON.stringify({ok:d.ok,service:d.service}));'
              exit 0
            fi
            sleep 1
          done
          docker logs bhai-x-ci-run
          exit 1

      - name: Production build
        run: npm run build
