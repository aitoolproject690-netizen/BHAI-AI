name: Live Public HTTP Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve public DNS
        run: |
          set -euo pipefail
          getent hosts bhai-ai-vpna.onrender.com

      - name: Fetch public HTTPS health endpoint
        env:
          URL: https://bhai-ai-vpna.onrender.com/api/health
        run: |
          set -euo pipefail
          body=/tmp/bhai-x-health.json
          headers=/tmp/bhai-x-health.headers
          http_code=""
          for attempt in 1 2 3 4; do
            echo "Public health attempt $attempt/4"
            if http_code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 45 \
              --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$URL")"; then
              if [ "$http_code" = "200" ] && node -e '
                const fs = require("fs");
                try {
                  const d = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                  process.exit(d.ok === true && d.service === "BHAI AI" ? 0 : 1);
                } catch { process.exit(1); }
              ' "$body"; then
                break
              fi
            else
              http_code="000"
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Health endpoint not ready (HTTP $http_code); waiting 10 seconds for Render startup."
              sleep 10
            fi
          done

          echo "PUBLIC_HTTP_STATUS=$http_code"
          echo "=== response headers ==="
          cat "$headers" 2>/dev/null || true
          echo "=== response body ==="
          cat "$body" 2>/dev/null || true

          test "$http_code" = "200"

          node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (d.ok !== true) throw new Error("health ok flag is not true");
            if (d.service !== "BHAI AI") throw new Error("unexpected service: " + d.service);
            console.log(JSON.stringify({
              verified: true,
              httpStatus: 200,
              ok: d.ok,
              service: d.service,
              version: d.version ?? null
            }));
          ' "$body"
