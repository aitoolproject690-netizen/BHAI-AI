name: One-time medical fast-path guard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Guard medical fast-chat path')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch medical fast-chat bypass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("api/agent.js")
          s = p.read_text()
          old = "if(quickChat){"
          new = "if(quickChat && !medicalMode){"
          if new in s:
              print("Medical fast-chat guard already present.")
          elif old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          else:
              raise SystemExit("Expected quickChat branch marker not found.")
          PY
          grep -n "if(quickChat" api/agent.js
      - name: Commit agent guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/agent.js
          git commit -m "Guard medical fast-chat path"
          git push origin main
      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/one-time-medical-fastpath-fix.yml
          git add .github/workflows/one-time-medical-fastpath-fix.yml
          git commit -m "Remove one-time medical fastpath workflow"
          git push origin main
