name: BHAI X Production Medical Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-medical-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for exact commit to become live
        env:
          EXPECTED_SHA: ${{ github.sha }}
          LIVE_URL: https://bhai-ai-vpna.onrender.com/api/health
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 72); do
            http_code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "$LIVE_URL" || true)"
            if [ "$http_code" = "200" ]; then
              set +e
              python - <<'PY'
          import json, os, sys
          with open("/tmp/health.json", "r", encoding="utf-8") as f:
              data=json.load(f)
          deployment=data.get("deployment") or {}
          medical=data.get("medicalSafety") or {}
          conversation=data.get("conversationRouting") or {}
          expected=os.environ["EXPECTED_SHA"]
          actual=deployment.get("commit","")
          ok=medical.get("ok") is True
          conversation_ok=conversation.get("ok") is True
          exact=actual==expected
          print(f"production_http=200")
          print(f"deployment_status={deployment.get('status')}")
          print(f"deployment_commit_matches_expected={exact}")
          print(f"medical_safety_ok={ok}")
          print(f"medical_safety_failures={len(medical.get('failures') or [])}")
          print(f"conversation_routing_ok={conversation_ok}")
          sys.exit(0 if exact and ok and conversation_ok else 2)
          PY
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                ready=1
                echo "Production medical smoke passed on attempt $attempt."
                break
              fi
            else
              echo "Attempt $attempt/72: production endpoint not ready yet (HTTP $http_code)."
            fi
            if [ "$attempt" -lt 72 ]; then sleep 10; fi
          done

          if [ "$ready" -ne 1 ]; then
            echo "Production medical smoke test failed: exact commit did not become live with all health self-checks passing."
            exit 1
          fi
      - name: Real Gemini TTS + lip-sync provider smoke (when owner smoke secret exists)
        env:
          BHAI_E2E_SMOKE_KEY: ${{ secrets.BHAI_E2E_SMOKE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BHAI_E2E_SMOKE_KEY:-}" ]; then
            echo "Real media smoke skipped: BHAI_E2E_SMOKE_KEY GitHub secret is not configured."
            exit 0
          fi
          code="$(curl --silent --show-error --max-time 360 -o /tmp/media-smoke.json -w '%{http_code}' \
            -X POST https://bhai-ai-vpna.onrender.com/api/media-smoke \
            -H "x-bhai-e2e-smoke-key: ${BHAI_E2E_SMOKE_KEY}" \
            -H 'content-type: application/json' --data '{}')"
          cat /tmp/media-smoke.json
          test "$code" = "200"
          node - <<'NODE'
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync("/tmp/media-smoke.json", "utf8"));
          if (!r.ok || r.voice?.realProviderResponse !== true || r.voice?.wavVerified !== true ||
              r.lipSync?.status !== "COMPLETED" || r.lipSync?.mp4Verified !== true) {
            console.error("Real media E2E proof is incomplete.");
            process.exit(1);
          }
          console.log("REAL_TTS_E2E=PASS");
          console.log("PROVIDER_LIPSYNC_MP4_E2E=PASS");
          console.log("INDEPENDENT_PIXEL_QUALITY_SCORE=" + String(r.lipSync?.pixelLipSyncVerified === true));
          NODE
