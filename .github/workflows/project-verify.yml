name: BHAI X Project Verification
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run repository test script when available"
        required: false
        default: "true"
        type: boolean
  push:
    branches: [main]
    paths:
      - "src/**"
      - "api/**"
      - "server.js"
      - "package.json"
      - "package-lock.json"
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
      - name: Run tests when defined
        if: ${{ github.event_name == 'push' || inputs.run_tests == true }}
        run: |
          if npm run | grep -qE '^  test'; then
            npm test
          else
            echo "No npm test script defined; build verification completed."
          fi
      - name: Verify required server modules
        run: |
          for f in server.js api/agent.js api/control.js api/system.js api/dna.js; do node --check "$f"; done
