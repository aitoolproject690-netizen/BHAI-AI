services:
  bhai-x-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bhai
      POSTGRES_PASSWORD: ${BHAI_X_DB_PASSWORD:?Set BHAI_X_DB_PASSWORD}
      POSTGRES_DB: bhaix
    volumes:
      - bhai-x-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U bhai -d bhaix"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  bhai-x:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      bhai-x-db:
        condition: service_healthy
    expose:
      - "10000"
    networks:
      - bhai-public
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 10000
      DATABASE_URL: postgresql://bhai:${BHAI_X_DB_PASSWORD:?Set BHAI_X_DB_PASSWORD}@bhai-x-db:5432/bhaix
      BHAI_CORE_URL: ${BHAI_CORE_URL:-http://bhai-core:10000}
      BHAI_CORE_API_KEY: ${BHAI_CORE_API_KEY:?Set BHAI_CORE_API_KEY}
      BHAI_IMAGE_URL: ${BHAI_IMAGE_URL:-}
      BHAI_IMAGE_API_KEY: ${BHAI_IMAGE_API_KEY:-}
      BHAI_IMAGE_AUTH_HEADER: ${BHAI_IMAGE_AUTH_HEADER:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      POLLINATIONS_API_KEY: ${POLLINATIONS_API_KEY:-}

volumes:
  bhai-x-db-data:

networks:
  bhai-public:
    external: true
    name: bhai-public
